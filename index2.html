<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>竞赛报名</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>程序设计竞赛报名</h1>
    <p>组队参赛，用一场比赛检验你的代码实力</p>
  </header>
  <nav>
    <a href="#intro">报名说明</a>
    <a href="#form">开始报名</a>
  </nav>
  <main>
    <section id="intro">
      <h2>报名说明</h2>
      <p>面向全校学生，可组队报名（每队 1-3 人）。报名截止后通过邮箱发送参赛须知，请确保信息真实有效。</p>
    </section>
    <section id="form">
      <h2>报名表单</h2>
      <form action="#" method="get">
        <p>
          <label for="name">姓名</label>
          <input type="text" id="name" name="name" placeholder="真实姓名" required>
        </p>
        <p>
          <label for="sid">学号</label>
          <input type="text" id="sid" name="sid" placeholder="11 位数字学号" pattern="\d{11}" required>
        </p>
        <p>
          <label for="mail">邮箱</label>
          <input type="email" id="mail" name="mail" placeholder="用于接收参赛须知" required>
        </p>
        <p>
          <label for="college">所在学院</label>
          <select id="college" name="college" required>
            <option value="">请选择学院</option>
            <option value="cs">信息学院</option>
            <option value="se">软件学院</option>
            <option value="other">其他学院</option>
          </select>
        </p>
        <p>
          <label for="teamsize">队伍人数（1-3 人）</label>
          <input type="number" id="teamsize" name="teamsize" min="1" max="3" value="1" required>
        </p>
        <p>
          <label for="birthday">出生日期</label>
          <input type="date" id="birthday" name="birthday" required>
        </p>
      </body>
</html>
